{% extends 'base.html' %}
{% block title %}Блог{% endblock %}
{% block content %}
{% for article in articles %}
<div class="col-7">
    <div class="card mb-4 box-shadow">
        <div class="card-header">
            <img src="{{ article.picture.url }}" alt="{{ article.picture }}" style="width:256px">
        </div>
        <div class="card-body">
            <div class="row">
                <h1 class="card-title pricing-card-title col-4">{{article.title}}</h1>
                <div class="col-2 d-flex justify-content-center"> <i class="bi bi-eye"></i> {{article.view_counter}}</div>
            </div>

            <div>
                {{article.content|truncatechars:400}}
            </div>
            <a href="/blog/{{article.pk}}" class="btn btn-lg btn-block btn-outline-primary">Читать далее</a>
        </div>
    </div>
</div>
{% empty %}
<div class="col-7">
    <div class="card mb-4 box-shadow">

        <div class="card-body">
            <h1 class="card-title pricing-card-title col-4">Статей нету, добавьте свою</h1>
            <a href="/blog/{{article.pk}}" class="btn btn-lg btn-block btn-outline-primary">Создать статью</a>
        </div>
    </div>
</div>
{% endfor %}
{% endblock %}
