{% extends 'base.html' %}
{% block title %}Страница - {{article.title}} {% endblock %}
{% block content %}
<div class="col-7">
    <div class="card mb-4 box-shadow">
        <div class="card-header">
            <img src="{{ article.picture.url }}" alt="{{ article.picture }}" style="width:256px">
        </div>
        <div class="card-body">
            <div class="row">
                <h1 class="card-title pricing-card-title col-4">{{article.title}}</h1>
                <div class="col-2 d-flex justify-content-center"> <i class="bi bi-eye"></i> {{article.view_counter}}</div>
            </div>

            <div>
                {{article.content}}
            </div>
            <a href="/blog/{{article.pk}}/edit" class="btn btn-lg btn-block btn-secondary">Изменить</a>
            <a href="/blog/{{article.pk}}/delete" class="btn btn-lg btn-block btn-danger">Удалить</a>
        </div>
    </div>
</div>

{% endblock %}
