{% extends 'base.html' %}
{% block title %}Главная страница{% endblock %}
{% block content %}
<div class="col-7">
    <div class="card mb-4 box-shadow">

        <div class="card-body">
            <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'articles_detail' pk=article.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
        </div>
    </div>
</div>

{% endblock %}
