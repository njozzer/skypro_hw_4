{% extends 'base.html' %}
{% block title %}Главная страница{% endblock %}
{% block content %}
<div class="col-7">
    <div class="card mb-4 box-shadow">

        <div class="card-body">
            <h1 class="mb-4">Удалить объект Product</h1>
            <p>Вы уверены, что хотите удалить "{{ product.name }}"?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url 'home' %}" class="btn btn-secondary">Отмена</a>
            </form>
            </form>
        </div>
    </div>
</div>

{% endblock %}
